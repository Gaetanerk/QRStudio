<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #111;
        color: white;
      }

      .container {
        padding: 40px;
      }

      .card {
        background: #1e1e1e;
        border-radius: 15px;
        padding: 10px 40px 20px;
        height: 850px;
      }

      h4 {
        margin: 8px 0 4px;
        font-size: 14px;
      }

      p {
        margin: 10px 0;
        font-size: 11px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        background: #2c2c2c;
        color: white;
        box-sizing: border-box;
      }

      button {
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: #2fa8a3;
        color: white;
        cursor: pointer;
      }

      canvas {
        margin: 20px auto;
        background: white;
        border-radius: 10px;
        display: block;
        width: 170px;
        height: 170px;
      }

      /* FILE */
      #fileContainer {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #fileName {
        font-size: 12px;
        opacity: 0.7;
      }

      /* COLOR PREVIEW */
      .colorBlock {
        margin: 10px 0 0;
      }

      .preview {
        width: 100%;
        height: 20px;
        border-radius: 5px;
      }

      #modeContainer {
        height: 110px;
        position: relative;
      }

      /* blocs superposés */
      #urlBlock,
      #wifiBlock {
        position: absolute;
        width: 100%;
        top: 0;
        left: 0;
      }

      #urlBlock {
        align-items: center;
        height: 100%;
      }

      .urlBlock {
        display: flex;
      }

      .urlBlockHidden {
        display: none;
      }

      #wifiBlock {
        flex-direction: column;
        justify-content: center;
      }

      .wifiBlock {
        display: flex;
      }

      .wifiBlockHidden {
        display: none;
      }

      #urlBlock,
      #wifiBlock {
        transition: opacity 0.2s;
      }
      .colorRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      /* petit carré */
      .colorRow input[type="color"] {
        width: 30px;
        height: 30px;
        padding: 0;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: none;
      }

      /* enlever style natif */
      .colorRow input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      .colorRow input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 6px;
      }

      .colorRow input[type="color"]::-moz-color-swatch {
        border: none;
        border-radius: 6px;
      }
      input[type="color"] {
        width: 100%;
        height: 30px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: none;
        cursor: pointer;
        overflow: hidden;
      }

      /* enlever le style natif */
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 8px;
      }

      /* Firefox */
      input[type="color"]::-moz-color-swatch {
        border: none;
        border-radius: 8px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }

      /* TRACK (la barre) */
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        background: #444;
        border-radius: 6px;
      }

      /* THUMB (le rond) */
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 11px;
        height: 11px;
        background: #2fa8a3;
        border-radius: 50%;
        cursor: pointer;
        margin-top: -2px;
      }

      /* Firefox */
      input[type="range"]::-moz-range-thumb {
        width: 11px;
        height: 11px;
        background: #2fa8a3;
        border-radius: 50%;
        cursor: pointer;
      }

      input[type="range"]::-moz-range-track {
        height: 4px;
        background: #ccc;
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h4>Format</h4>
        <select id="mode">
          <option value="url">URL</option>
          <option value="wifi">WiFi</option>
        </select>

        <div id="modeContainer">
          <div id="urlBlock" class="urlBlock">
            <input id="urlInput" placeholder="https://site.com" />
          </div>

          <div id="wifiBlock" class="wifiBlockHidden">
            <input id="ssid" placeholder="Nom WiFi" />
            <input id="password" placeholder="Mot de passe" />
          </div>
        </div>

        <!-- 🎨 COULEURS -->
        <div class="colorRow">
          <span><h4>Couleur du QR Code</h4></span>
          <input type="color" id="color" value="#000000" />
        </div>

        <div class="colorRow">
          <span><h4>Couleur du fond</h4></span>
          <input type="color" id="bgColor" value="#ffffff" />
        </div>

        <!-- 📁 LOGO -->
        <h4>Logo (optionnel)</h4>
        <div id="fileContainer">
          <button id="selectFileBtn">Parcourir</button>
          <span id="fileName">Aucun fichier</span>
          <button id="removeFileBtn" style="display: none">❌</button>
          <input type="file" id="logoInput" accept="image/*" hidden />
        </div>

        <!-- 🎯 SLIDER LOGO -->
        <p>Taille du logo : <span id="logoSizeValue">40</span></p>
        <div style="margin-top: -20px">
          <input type="range" id="logoSize" min="20" max="100" value="40" />
        </div>

        <p>Position horizontale : <span id="logoPosXValue">0</span></p>
        <div style="margin-top: -20px">
          <input type="range" id="logoPosX" min="-100" max="100" value="0" />
        </div>

        <p>Position verticale : <span id="logoPosYValue">0</span></p>
        <div style="margin-top: -20px">
          <input type="range" id="logoPosY" min="-100" max="100" value="0" />
        </div>

        <canvas id="canvas"></canvas>

        <button id="pngBtn">Télécharger PNG</button>
        <button id="svgBtn">Télécharger SVG</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
