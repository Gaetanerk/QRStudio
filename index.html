<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #111;
        color: white;
      }

      .container {
        padding: 40px;
      }

      .card {
        background: #1e1e1e;
        border-radius: 15px;
        padding: 10px 40px 20px;
        min-height: 850px;
        text-align: center;
      }

      h4 {
        margin: 8px 0 4px;
        font-size: 14px;
      }

      p {
        margin: 10px 0;
        font-size: 11px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        background: #2c2c2c;
        color: white;
        box-sizing: border-box;
      }

      button {
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: #2fa8a3;
        color: white;
        cursor: pointer;
      }

      canvas {
        margin: 20px auto;
        background: white;
        border-radius: 10px;
        display: block;
        width: 170px;
        height: 170px;
      }

      #fileContainer {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #fileName {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        opacity: 0.7;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #removeFileBtn {
        width: 32px;
        height: 32px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #modeContainer {
        height: 110px;
        position: relative;
      }

      #urlBlock,
      #wifiBlock {
        position: absolute;
        width: 100%;
        top: 0;
        left: 0;
      }

      .urlBlock {
        display: flex;
      }
      .urlBlockHidden {
        display: none;
      }

      .wifiBlock {
        display: flex;
        flex-direction: column;
      }
      .wifiBlockHidden {
        display: none;
      }
      input[type="color"] {
        height: 40px;
        padding: 2px;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
      }

      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 6px;
      }

      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      input[type="color"]::-moz-color-swatch {
        border: none;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h4>Format</h4>
        <select id="mode">
          <option value="url">URL</option>
          <option value="wifi">WiFi</option>
        </select>

        <div id="modeContainer">
          <div id="urlBlock" class="urlBlock">
            <input id="urlInput" placeholder="https://site.com" />
          </div>

          <div id="wifiBlock" class="wifiBlockHidden">
            <input id="ssid" placeholder="Nom WiFi" />
            <input id="password" placeholder="Mot de passe" />
          </div>
        </div>

        <h4>Couleur du QR Code</h4>
        <input type="color" id="color" value="#000000" />

        <h4>Couleur du fond</h4>
        <input type="color" id="bgColor" value="#ffffff" />

        <h4>Logo (optionnel)</h4>
        <div id="fileContainer">
          <button id="selectFileBtn">Parcourir</button>
          <span id="fileName">Aucun fichier</span>
          <button id="removeFileBtn" style="display: none">❌</button>
          <input type="file" id="logoInput" hidden />
        </div>

        <p>Taille du logo : <span id="logoSizeValue">40</span></p>
        <input type="range" id="logoSize" min="20" max="100" value="40" />

        <p>Position horizontale : <span id="logoPosXValue">0</span></p>
        <input type="range" id="logoPosX" min="-100" max="100" value="0" />

        <p>Position verticale : <span id="logoPosYValue">0</span></p>
        <input type="range" id="logoPosY" min="-100" max="100" value="0" />

        <canvas id="canvas"></canvas>

        <button id="pngBtn">Télécharger PNG</button>
        <button id="svgBtn">Télécharger SVG</button>
      </div>
    </div>

    <!-- QR classique -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <!-- 🔥 QR stylé -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling/lib/qr-code-styling.js"></script>

    <script src="renderer.js"></script>
  </body>
</html>
