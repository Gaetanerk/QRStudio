<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      /* =========================
   GLOBAL
========================= */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        font-family: Inter, "Segoe UI", Arial, sans-serif;

        background: radial-gradient(circle at top left, #16213e, #090d18);

        color: white;
      }

      * {
        box-sizing: border-box;
      }

      /* =========================
   APP
========================= */

      .app {
        width: 100%;
        height: 100%;

        display: grid;
        grid-template-columns: 420px 1fr;
      }

      /* =========================
   SIDEBAR
========================= */

      .sidebar {
        height: 100%;

        padding: 30px;

        overflow-y: auto;

        background: rgba(8, 15, 28, 0.82);

        backdrop-filter: blur(20px);

        border-right: 1px solid rgba(255, 255, 255, 0.05);
      }

      .sidebar::-webkit-scrollbar {
        width: 5px;
      }

      .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);

        border-radius: 999px;
      }

      /* =========================
   BRAND
========================= */

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;

        margin-bottom: 40px;
      }

      .brandLogo {
        width: 65px;
        height: 65px;

        border-radius: 22px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;
        font-weight: bold;

        background: linear-gradient(135deg, #2fa8a3, #3b82f6);

        box-shadow: 0 10px 35px rgba(47, 168, 163, 0.4);
      }

      .brand h1 {
        margin: 0;
        font-size: 30px;
      }

      .brand span {
        opacity: 0.6;
        font-size: 13px;
      }

      /* =========================
   FORM
========================= */

      .section {
        margin-bottom: 24px;
      }

      label {
        display: block;

        margin-bottom: 10px;

        font-size: 13px;
        font-weight: 600;

        opacity: 0.7;
      }

      /* =========================
   INPUTS
========================= */

      input,
      select {
        width: 100%;

        border: none;
        outline: none;

        border-radius: 18px;

        padding: 15px;

        font-size: 14px;

        color: white;

        background: rgba(255, 255, 255, 0.06);

        transition: 0.2s ease;
      }

      input:focus,
      select:focus {
        background: rgba(255, 255, 255, 0.09);

        box-shadow: 0 0 0 2px rgba(47, 168, 163, 0.45);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.35);
      }

      /* =========================
   SELECT
========================= */

      select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;

        cursor: pointer;

        padding-right: 52px;

        background-color: rgba(255, 255, 255, 0.06);

        background-image:
          linear-gradient(45deg, transparent 50%, white 50%),
          linear-gradient(135deg, white 50%, transparent 50%);

        background-position:
          calc(100% - 22px) calc(50% - 3px),
          calc(100% - 16px) calc(50% - 3px);

        background-size: 6px 6px;

        background-repeat: no-repeat;

        transition:
          background-color 0.2s ease,
          box-shadow 0.2s ease,
          border 0.2s ease;
      }

      select:focus {
        background-color: rgba(255, 255, 255, 0.09);

        background-image:
          linear-gradient(45deg, transparent 50%, white 50%),
          linear-gradient(135deg, white 50%, transparent 50%);

        background-position:
          calc(100% - 22px) calc(50% - 3px),
          calc(100% - 16px) calc(50% - 3px);

        background-size: 6px 6px;

        background-repeat: no-repeat;

        box-shadow: 0 0 0 2px rgba(47, 168, 163, 0.45);
      }

      select option {
        background: #111827;
        color: white;
      }

      /* =========================
   MODE CONTAINER
========================= */

      #modeContainer {
        position: relative;

        margin-top: 18px;

        min-height: 210px;
      }

      /* =========================
   DYNAMIC BLOCKS
========================= */

      #urlBlock,
      #wifiBlock,
      #mapsBlock {
        position: absolute;

        top: 0;
        left: 0;

        width: 100%;

        display: flex;
        flex-direction: column;
        gap: 12px;

        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }

      .urlBlockHidden,
      .wifiBlockHidden {
        opacity: 0;

        pointer-events: none;

        transform: translateY(10px);
      }

      /* =========================
   FIXED SPACERS
========================= */

      .modeSpacer {
        height: 124px;
      }

      .modeSpacerSmall {
        height: 56px;
      }

      /* =========================
   COLOR PICKERS
========================= */

      input[type="color"] {
        height: 54px;

        padding: 4px;

        cursor: pointer;
      }

      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 12px;
      }

      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      /* =========================
   FILE
========================= */

      #fileContainer {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #fileName {
        flex: 1;

        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;

        opacity: 0.7;
        font-size: 13px;
      }

      #removeFileBtn {
        width: 45px;
        height: 45px;

        padding: 0;

        flex-shrink: 0;
      }

      /* =========================
   BUTTONS
========================= */

      button {
        border: none;
        outline: none;

        border-radius: 18px;

        padding: 15px 18px;

        font-size: 14px;
        font-weight: 600;

        color: white;

        cursor: pointer;

        transition: 0.25s ease;

        background: linear-gradient(135deg, #2fa8a3, #3b82f6);

        box-shadow: 0 10px 30px rgba(47, 168, 163, 0.25);
      }

      button:hover {
        transform: translateY(-2px);

        box-shadow: 0 16px 40px rgba(47, 168, 163, 0.4);
      }

      /* =========================
   RANGE
========================= */

      .sliderLabel {
        display: flex;
        justify-content: space-between;

        margin-bottom: 8px;

        font-size: 13px;

        opacity: 0.7;
      }

      input[type="range"] {
        appearance: none;

        height: 8px;

        border-radius: 999px;

        background: rgba(255, 255, 255, 0.1);

        padding: 0;
      }

      input[type="range"]::-webkit-slider-thumb {
        appearance: none;

        width: 18px;
        height: 18px;

        border-radius: 50%;

        background: linear-gradient(135deg, #2fa8a3, #3b82f6);

        cursor: pointer;
      }

      /* =========================
   PREVIEW
========================= */

      .preview {
        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 40px;
      }

      .previewCard {
        position: relative;

        width: 500px;
        height: 500px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 40px;

        background: rgba(255, 255, 255, 0.04);

        border: 1px solid rgba(255, 255, 255, 0.06);

        overflow: hidden;

        backdrop-filter: blur(14px);

        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .previewGlow {
        position: absolute;

        width: 400px;
        height: 400px;

        border-radius: 50%;

        background: radial-gradient(
          circle,
          rgba(47, 168, 163, 0.25),
          transparent 70%
        );
      }

      canvas {
        position: relative;

        width: 100%;
        height: 100%;

        border-radius: 40px;

        background: white;

        padding: 35px;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      /* =========================
   ACTIONS
========================= */

      .actions {
        display: flex;
        gap: 20px;

        margin-top: 35px;
      }

      .actions button {
        min-width: 220px;
      }
    </style>
  </head>

  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <!-- HEADER -->
        <div class="brand">
          <div class="brandLogo">QR</div>

          <div>
            <h1>QR Studio</h1>
            <span>Generate beautiful QR codes</span>
          </div>
        </div>

        <!-- FORMAT -->
        <div class="section">
          <label>Format</label>

          <select id="mode">
            <option value="url">URL</option>
            <option value="wifi">WiFi</option>
            <option value="maps">Maps / GPS</option>
          </select>
        </div>

        <!-- DYNAMIC BLOCKS -->
        <div id="modeContainer">
          <!-- URL -->
          <div id="urlBlock">
            <input id="urlInput" placeholder="https://site.com" />

            <!-- espace fixe -->
            <div class="modeSpacer"></div>
          </div>

          <!-- WIFI -->
          <div id="wifiBlock" class="wifiBlockHidden">
            <input id="ssid" placeholder="Nom WiFi" />

            <input id="password" placeholder="Mot de passe" />

            <!-- espace fixe -->
            <div class="modeSpacerSmall"></div>
          </div>

          <!-- MAPS -->
          <div id="mapsBlock" class="wifiBlockHidden">
            <select id="mapsType">
              <option value="address">Adresse</option>

              <option value="coords">Latitude / Longitude</option>
            </select>

            <!-- ADRESSE -->
            <div id="addressBlock">
              <input id="mapsAddress" placeholder="10 rue de Paris" />
            </div>

            <!-- GPS -->
            <div id="coordsBlock" style="display: none">
              <input id="latitude" placeholder="Latitude" />

              <input id="longitude" placeholder="Longitude" />
            </div>
          </div>
        </div>

        <!-- QR COLOR -->
        <div class="section">
          <label>Couleur QR</label>

          <input type="color" id="color" value="#000000" />
        </div>

        <!-- BG COLOR -->
        <div class="section">
          <label>Couleur fond</label>

          <input type="color" id="bgColor" value="#ffffff" />
        </div>

        <!-- LOGO -->
        <div class="section">
          <label>Logo</label>

          <div id="fileContainer">
            <button id="selectFileBtn">Importer</button>

            <span id="fileName"> Aucun fichier </span>

            <button id="removeFileBtn" style="display: none">✕</button>

            <input type="file" id="logoInput" hidden />
          </div>
        </div>

        <!-- LOGO SIZE -->
        <div class="section">
          <div class="sliderLabel">
            <span>Taille logo</span>

            <span id="logoSizeValue"> 25 </span>
          </div>

          <input type="range" id="logoSize" min="20" max="100" value="25" />
        </div>

        <!-- POS X -->
        <div class="section">
          <div class="sliderLabel">
            <span>Position X</span>

            <span id="logoPosXValue"> 0 </span>
          </div>

          <input type="range" id="logoPosX" min="-100" max="100" value="0" />
        </div>

        <!-- POS Y -->
        <div class="section">
          <div class="sliderLabel">
            <span>Position Y</span>

            <span id="logoPosYValue"> 0 </span>
          </div>

          <input type="range" id="logoPosY" min="-100" max="100" value="0" />
        </div>

        <!-- STYLE QR-->
        <div class="section">
          <label>Style QR</label>

          <select id="qrStyle">
            <option value="square">Classic</option>
            <option value="rounded">Rounded</option>
            <option value="dots">Dots</option>
            <option value="extra-rounded">Extra Rounded</option>
            <option value="classy">Elegant</option>
            <option value="classy-rounded">Classy Rounded</option>
          </select>
        </div>
      </aside>

      <!-- PREVIEW -->
      <main class="preview">
        <div class="previewCard">
          <div class="previewGlow"></div>

          <canvas id="canvas"></canvas>
        </div>

        <!-- EXPORT -->
        <div class="actions">
          <button id="pngBtn">Télécharger PNG</button>

          <button id="svgBtn">Télécharger SVG</button>
        </div>
      </main>
    </div>

    <!-- QR -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <!-- QR STYLE -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling/lib/qr-code-styling.js"></script>

    <!-- APP -->
    <script src="renderer.js"></script>
  </body>
</html>
